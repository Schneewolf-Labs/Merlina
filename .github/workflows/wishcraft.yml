name: Wishcraft pilot checks
on:
  pull_request:
  push:
    branches: [main, 'feat/m3-*']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: >-
          python -m pip install fastapi uvicorn pydantic pydantic-settings
          python-multipart datasets s3fs requests Pillow qrcode
          -r tests/requirements-test.txt
      - name: Storage, lifecycle, isolation, payments and advisor contracts
        run: >-
          python -m pytest tests/test_s3_artifacts.py tests/test_remote_*.py
          tests/test_artifact_capabilities.py tests/test_hosted_*.py
          tests/hosted/test_billing.py tests/test_worker_monitor.py
          tests/test_queue.py tests/test_api_comprehensive.py --timeout=30
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/frontend/test_hosted.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/frontend/test_hosted_browser.mjs
